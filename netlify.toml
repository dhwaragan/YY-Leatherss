[build]
  base = "app"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  port = 3000

# Cache static assets aggressively - reduces bandwidth and page load time
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# API caching headers - reduce repeated Supabase downloads
[[headers]]
  for = "/api/orders"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/api/preorders"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[redirects]]
  from = "/api/razorpay/create-order"
  to = "/.netlify/functions/razorpay-create-order"
  status = 200
  force = true

[[redirects]]
  from = "/api/razorpay/verify-payment"
  to = "/.netlify/functions/razorpay-verify-payment"
  status = 200
  force = true

[[redirects]]
  from = "/api/razorpay/webhook"
  to = "/.netlify/functions/razorpay-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/maintenance.html"
  status = 200